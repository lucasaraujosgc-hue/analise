version: '3.8'

services:
  auditacnpj:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: virgula_contabil
    restart: unless-stopped
    ports:
      - "3000:3000"
    # O Chromium do robô do PGMEI precisa de memória compartilhada
    shm_size: "1gb"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - STORAGE_DIR=/app/storage
      - DATA_DIR=/app/data
      - PGMEI_HEADLESS=false
    volumes:
      # PDFs de CND, relatórios do MEI e dossiês ficam no seu computador
      - ./storage:/app/storage
      # Carteira multi-CNPJ e últimas consultas do MEI
      - ./data:/app/data
